<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>練習用デザインアプリ</title>
<!--
  そうさ先生の練習用画面（暗い画面・アイコンだけのボタン）。Blender・Illustrator・Photoshop のような
  暗い色のソフトを、そのソフトがない PC でも試すためのもの。この画面を共有して「🧭 AIにおまかせ」で使う。
  例: 「長方形を描いて、色を赤にしたい」「円を描いて、不透明度を 50% にしたい」
  左のツールバーとパネルのタブは、本物のソフトと同じく文字のないアイコンだけ（名前はマウスを乗せると下に出る）
-->
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 13px/1.5 "Hiragino Sans", system-ui, sans-serif; color: #d6d6d6; background: #1f1f1f;
    display: grid; grid-template-rows: 28px 38px 1fr 24px; grid-template-columns: 48px 1fr 280px; user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .menubar { grid-column: 1 / -1; display: flex; gap: 2px; padding: 0 8px; background: #2a2a2a; align-items: center; }
  .menubar button { border: 0; background: none; padding: 2px 10px; border-radius: 3px; }
  .menubar button:hover { background: #3c3c3c; }
  .options { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; padding: 0 12px; background: #323232; border-bottom: 1px solid #1a1a1a; }
  .options label { display: flex; gap: 6px; align-items: center; }
  .options select, .options input { background: #262626; color: #ddd; border: 1px solid #4a4a4a; border-radius: 3px; font: inherit; padding: 1px 4px; }
  .tools { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; background: #323232; border-right: 1px solid #1a1a1a; }
  .tools button, .tabs button { width: 34px; height: 34px; border: 0; border-radius: 4px; background: none; display: grid; place-items: center; padding: 0; }
  .tools button:hover, .tabs button:hover { background: #444; }
  .tools button[aria-pressed="true"], .tabs button[aria-selected="true"] { background: #2d5f9e; }
  svg { width: 20px; height: 20px; stroke: #d0d0d0; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .stage { background: #262626; display: grid; place-items: center; overflow: hidden; }
  .artboard { position: relative; width: min(760px, 90%); aspect-ratio: 4 / 3; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.6); cursor: crosshair; }
  .shape { position: absolute; border: 2px solid transparent; }
  .shape.selected { outline: 1px dashed #2d8cff; outline-offset: 3px; }
  .shape.text { font-size: 28px; color: #222; white-space: nowrap; border: 0; }
  .panel { background: #323232; border-left: 1px solid #1a1a1a; display: flex; flex-direction: column; }
  .tabs { display: flex; gap: 4px; padding: 6px 8px; border-bottom: 1px solid #1a1a1a; }
  .section { padding: 10px 12px; display: grid; gap: 8px; border-bottom: 1px solid #262626; }
  .section h3 { margin: 0; font-size: 12px; color: #aaa; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row > span:first-child { width: 64px; }
  .swatches { display: flex; gap: 6px; }
  .swatches button { width: 22px; height: 22px; border: 1px solid #111; border-radius: 3px; padding: 0; }
  .layers { padding: 6px 12px; display: grid; gap: 4px; }
  .layers div { padding: 3px 6px; border-radius: 3px; background: #2a2a2a; }
  .statusbar { grid-column: 1 / -1; display: flex; gap: 16px; align-items: center; padding: 0 10px; background: #2a2a2a; color: #aaa; font-size: 12px; }
  .menu { position: fixed; z-index: 10; background: #2c2c2c; border: 1px solid #111; border-radius: 4px; padding: 4px 0; min-width: 200px; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 16px; }
  .menu button:hover { background: #2d5f9e; }
</style>
</head>
<body>
<nav class="menubar" id="menubar">
  <button data-menu="file">ファイル</button>
  <button data-menu="edit">編集</button>
  <button data-menu="object">オブジェクト</button>
  <button data-menu="type">書式</button>
  <button data-menu="select">選択</button>
  <button data-menu="view">表示</button>
  <button data-menu="window">ウィンドウ</button>
</nav>

<div class="options">
  <span id="toolName">選択ツール</span>
  <label>線幅 <input id="strokeWidth" type="number" value="2" min="0" max="20" style="width:52px"></label>
  <label>角の丸み <input id="radius" type="number" value="0" min="0" max="80" style="width:52px"></label>
</div>

<!-- ツールバー: アイコンだけ（名前は title とステータスバーに出る） -->
<div class="tools" id="tools">
  <button data-tool="select" title="選択ツール" aria-label="選択ツール" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M5 3l12 9-5 1 3 6-2 1-3-6-4 4z"/></svg></button>
  <button data-tool="rect" title="長方形ツール" aria-label="長方形ツール"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12"/></svg></button>
  <button data-tool="ellipse" title="楕円形ツール" aria-label="楕円形ツール"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
  <button data-tool="pen" title="ペンツール" aria-label="ペンツール"><svg viewBox="0 0 24 24"><path d="M12 3l6 9-6 9-6-9z"/><circle cx="12" cy="12" r="1.6"/></svg></button>
  <button data-tool="text" title="文字ツール" aria-label="文字ツール"><svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v15M9 20h6"/></svg></button>
  <button data-tool="eyedropper" title="スポイトツール" aria-label="スポイトツール"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-3 1-8 8H6v-3l8-8z"/></svg></button>
  <button data-tool="hand" title="手のひらツール" aria-label="手のひらツール"><svg viewBox="0 0 24 24"><path d="M7 12V6a1.5 1.5 0 013 0v5V4.5a1.5 1.5 0 013 0V11V5.5a1.5 1.5 0 013 0V13l1-2a1.5 1.5 0 012.6 1.5L17 19a4 4 0 01-4 2h-2a4 4 0 01-4-4z"/></svg></button>
  <button data-tool="zoom" title="ズームツール" aria-label="ズームツール"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M15 15l5 5"/></svg></button>
</div>

<main class="stage"><div class="artboard" id="artboard"></div></main>

<aside class="panel">
  <!-- パネルのタブ: これもアイコンだけ -->
  <div class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="props" title="プロパティ" aria-label="プロパティ" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    <button role="tab" data-tab="layers" title="レイヤー" aria-label="レイヤー"><svg viewBox="0 0 24 24"><path d="M12 4l9 5-9 5-9-5z"/><path d="M3 14l9 5 9-5"/></svg></button>
    <button role="tab" data-tab="color" title="カラー" aria-label="カラー"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/></svg></button>
    <button role="tab" data-tab="align" title="整列" aria-label="整列"><svg viewBox="0 0 24 24"><path d="M4 4v16"/><rect x="7" y="6" width="10" height="4"/><rect x="7" y="14" width="6" height="4"/></svg></button>
    <button role="tab" data-tab="export" title="書き出し" aria-label="書き出し"><svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 14v6h14v-6"/></svg></button>
  </div>
  <div id="tabProps">
    <div class="section">
      <h3>アピアランス</h3>
      <div class="row"><span>塗り</span><div class="swatches" id="fillSwatches"></div></div>
      <div class="row"><span>線</span><div class="swatches" id="strokeSwatches"></div></div>
      <div class="row"><span>不透明度</span><input id="opacity" type="range" min="0" max="100" value="100"><span id="opacityVal">100%</span></div>
    </div>
  </div>
  <div id="tabLayers" hidden>
    <div class="section"><h3>レイヤー</h3></div>
    <div class="layers" id="layerList"></div>
  </div>
  <div id="tabOther" hidden><div class="section"><h3 id="otherTitle"></h3><div>（練習用なので中身はありません）</div></div></div>
</aside>

<footer class="statusbar"><span id="hover">アイコンにマウスを乗せると、ここに名前が出ます</span><span id="info"></span></footer>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const COLORS = [["白", "#ffffff"], ["黒", "#222222"], ["赤", "#e03a2f"], ["青", "#2d6fd6"], ["緑", "#2f9e57"], ["黄", "#f2c230"]];
const TOOL_NAMES = { select: "選択ツール", rect: "長方形ツール", ellipse: "楕円形ツール", pen: "ペンツール", text: "文字ツール",
  eyedropper: "スポイトツール", hand: "手のひらツール", zoom: "ズームツール" };
let tool = "select", selected = null, count = 0;

// マウスを乗せた部品の名前をステータスバーに出す（本物のソフトのツールチップの代わり）
document.addEventListener("mouseover", (e) => {
  const b = e.target.closest("[aria-label]");
  $("hover").textContent = b ? b.getAttribute("aria-label") : "アイコンにマウスを乗せると、ここに名前が出ます";
});

$("tools").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  tool = b.dataset.tool;
  for (const t of $("tools").children) t.setAttribute("aria-pressed", String(t === b));
  $("toolName").textContent = TOOL_NAMES[tool];
});

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  for (const t of $("tabs").children) t.setAttribute("aria-selected", String(t === b));
  $("tabProps").hidden = b.dataset.tab !== "props";
  $("tabLayers").hidden = b.dataset.tab !== "layers";
  $("tabOther").hidden = ["props", "layers"].includes(b.dataset.tab);
  $("otherTitle").textContent = b.getAttribute("aria-label");
});

function swatches(box, apply) {
  for (const [name, color] of COLORS) {
    const b = document.createElement("button");
    b.style.background = color;
    b.title = b.ariaLabel = name;
    b.addEventListener("click", () => { if (selected) { apply(selected, color); info(); } });
    box.append(b);
  }
}
swatches($("fillSwatches"), (s, c) => { if (s.classList.contains("text")) s.style.color = c; else s.style.background = c; });
swatches($("strokeSwatches"), (s, c) => { s.style.borderColor = c; });

$("opacity").addEventListener("input", () => {
  $("opacityVal").textContent = `${$("opacity").value}%`;
  if (selected) selected.style.opacity = $("opacity").value / 100;
});
$("radius").addEventListener("input", () => { if (selected?.dataset.kind === "rect") selected.style.borderRadius = `${$("radius").value}px`; });
$("strokeWidth").addEventListener("input", () => { if (selected) selected.style.borderWidth = `${$("strokeWidth").value}px`; });

function select(s) {
  selected?.classList.remove("selected");
  selected = s;
  s?.classList.add("selected");
  if (s) $("opacity").value = Math.round((Number(s.style.opacity) || 1) * 100), $("opacityVal").textContent = `${$("opacity").value}%`;
  info();
}

function info() {
  $("info").textContent = selected ? `選択中: ${selected.dataset.name}` : "";
  $("layerList").replaceChildren(...[...$("artboard").children].reverse().map((s) => {
    const d = document.createElement("div");
    d.textContent = s.dataset.name;
    return d;
  }));
}

// 長方形・楕円はドラッグで描く。文字ツールはクリックした所に文字を置く
let drag = null;
$("artboard").addEventListener("pointerdown", (e) => {
  const ab = $("artboard").getBoundingClientRect();
  const x = e.clientX - ab.left, y = e.clientY - ab.top;
  if (tool === "select") { select(e.target.closest(".shape")); return; }
  if (tool === "text") {
    const s = document.createElement("div");
    s.className = "shape text";
    s.textContent = "テキスト";
    s.dataset.name = `テキスト ${++count}`;
    Object.assign(s.style, { left: `${x}px`, top: `${y - 20}px` });
    $("artboard").append(s);
    select(s);
    return;
  }
  if (tool !== "rect" && tool !== "ellipse") return;
  const s = document.createElement("div");
  s.className = "shape";
  s.dataset.kind = tool;
  s.dataset.name = `${tool === "rect" ? "長方形" : "楕円"} ${++count}`;
  Object.assign(s.style, { left: `${x}px`, top: `${y}px`, width: "0", height: "0", background: "#b9c4d0", borderColor: "#222",
    borderWidth: `${$("strokeWidth").value}px`, borderRadius: tool === "ellipse" ? "50%" : `${$("radius").value}px` });
  $("artboard").append(s);
  drag = { s, x, y };
  $("artboard").setPointerCapture(e.pointerId);
});
$("artboard").addEventListener("pointermove", (e) => {
  if (!drag) return;
  const ab = $("artboard").getBoundingClientRect();
  const x = e.clientX - ab.left, y = e.clientY - ab.top;
  Object.assign(drag.s.style, { left: `${Math.min(x, drag.x)}px`, top: `${Math.min(y, drag.y)}px`,
    width: `${Math.abs(x - drag.x)}px`, height: `${Math.abs(y - drag.y)}px` });
});
$("artboard").addEventListener("pointerup", () => {
  if (!drag) return;
  const s = drag.s;
  drag = null;
  // クリックだけ（ほとんど動かさなかった）なら、決まった大きさで描く
  if (s.offsetWidth < 8 && s.offsetHeight < 8) Object.assign(s.style, { width: "160px", height: "110px" });
  select(s);
});

// メニュー（練習用なので一部だけ動く）
const MENUS = {
  file: ["新規…", "開く…", "保存", "書き出し…"],
  edit: ["取り消し", "やり直し", "カット", "コピー", "ペースト", "消去"],
  object: ["変形", "重ね順", "グループ", "ロック", "パス"],
  type: ["フォント", "サイズ", "アウトラインを作成"],
  select: ["すべてを選択", "選択を解除"],
  view: ["ズームイン", "ズームアウト", "アートボードを全体表示"],
  window: ["プロパティ", "レイヤー", "カラー", "整列"],
};
let menu = null;
$("menubar").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  menu?.remove();
  menu = document.createElement("div");
  menu.className = "menu";
  const r = b.getBoundingClientRect();
  Object.assign(menu.style, { left: `${r.left}px`, top: `${r.bottom}px` });
  for (const item of MENUS[b.dataset.menu]) {
    const m = document.createElement("button");
    m.textContent = item;
    m.addEventListener("click", () => {
      if (item === "消去" && selected) { selected.remove(); select(null); }
      if (item === "すべてを選択") select($("artboard").lastElementChild);
      if (item === "選択を解除") select(null);
      if (item === "アウトラインを作成" && selected?.classList.contains("text")) {
        selected.style.webkitTextStroke = "1px currentColor";
        selected.dataset.name += "（アウトライン）";
        info();
      }
      menu.remove();
      menu = null;
    });
    menu.append(m);
  }
  document.body.append(menu);
  e.stopPropagation();
});
document.addEventListener("click", () => { menu?.remove(); menu = null; });
info();
</script>
</body>
</html>
